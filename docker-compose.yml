services:
  wa-rizquna-web:
    build: .
    container_name: wa_rizquna_web
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=8089
      - HOSTNAME=0.0.0.0
      - WA_GATEWAY_URL=http://wa_gateway:3000
      - DATA_DIR=/app/data
    ports:
      - "127.0.0.1:8088:8089"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rizquna_web_data:/app/data
    networks:
      - rizqunaid_rizquna_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8089/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  rizquna_web_data:

networks:
  rizqunaid_rizquna_net:
    external: true
